spring:
  application:
    name: Hort-Sistema

  datasource:
    url: jdbc:sqlite:hort_sistema.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect

    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: hort-sistema-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256