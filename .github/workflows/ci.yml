name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Build and run tests with coverage
        run: ./mvnw --no-transfer-progress verify
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256' }}

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Check code formatting (Spotless)
        run: ./mvnw --no-transfer-progress spotless:check

      - name: Check code style (Checkstyle)
        run: ./mvnw --no-transfer-progress checkstyle:check
