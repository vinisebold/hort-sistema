spring:
  application:
    name: Hort-Sistema

  datasource:
    url: jdbc:sqlite:data/hort_sistema.db?date_class=TEXT
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect

    hibernate:
      ddl-auto: none

    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: ${JWT_SECRET:hort-sistema-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-fallback-dev-only}

logging:
  level:
    dev.vinisebold.hort: INFO
    org.springframework: WARN
    org.hibernate: WARN
